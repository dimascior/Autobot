[project]
name = "swarm-coordinator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coordinator = "coordinator.loop:main"
coordinator-authorize = "coordinator.authorize:main"
coordinator-discover = "coordinator.discover:main"
coordinator-verify = "coordinator.verify_enforcement:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinator", "src/autobot", "src/contract_library"]
