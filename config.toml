[paths]
# Machine paths are resolved by discover.py from authoritative sources
# (~/.claude/settings.json, $AUTOSWARM_HOME, PATH). Leave blank to auto-discover;
# pin in config.local.toml (gitignored) to override. Explicit values here win.
autoswarm_home = ""   # else $AUTOSWARM_HOME, else %LOCALAPPDATA%\autoswarm
findings_dir   = ""   # defaults to the codex route's resolved workspace
gate_root      = ""   # parsed from the settings.json PreToolUse hook
backlog_file = "backlog.toml"
ledger_db = "coordinator.db"

[systems]
# Programs `discover.py --check` verifies. Blank = resolved at runtime from
# authoritative sources, never hardcoded (so this file stays safe to publish):
#   codex_handoff_dir  <- ~/.codex/hooks.json (PreCompact/SessionStart)
#   devtools_dir       <- $CODEX_HANDOFF_DEVTOOLS or ~/.codex-handoff/config.json
#   codeapi_ports      <- ~/.codex-handoff/config.json (codeapi.ports)
# Requiredness is PER ROUTE: a `codex` route needs codex_cli + codex_handoff +
# devtools_dir; a `claude-code` route needs claude_cli; the gate is always
# required; CODEAPI / hdb / Akashic are accommodations (reported, never block).
# See docs/ARCHITECTURE.md. Set a value only to override discovery.
codex_handoff_dir    = ""   # codex-handoff checkout's bin/handoff.mjs (or its dir)
devtools_dir         = ""   # Codex_claude_devtools checkout (has scripts/codex-export.ts)
codeapi_ports        = ""   # CODEAPI band, e.g. "47337-47400", or "off"
evidence_catalog_dir = ""   # hdb / HeliosEvidenceCatalog root (child-session data source)
akashic_dir          = ""   # Akashic checkout (installs/validates the Helios runtime)

[caps]
max_concurrent = 3
max_dispatches_per_cycle = 5
max_cycles_per_hour = 6
daily_ceiling = 50

[cooldowns]
default_minutes = 30
failed_retry_minutes = 60
# An in-progress dispatch with no result after this long becomes `stale`
# (flagged for reconciliation, NOT auto-redispatched).
stale_threshold_minutes = 120

[models]
# The planner's own reasoning model. Runs through the `claude` CLI
# (subscription auth) -- never the billed API. Must be a claude-* model;
# a gpt/codex planner would have to route through `autoswarm run --agent codex`.
planner = "claude-opus-4-6"

# Dispatch routes: each maps to a subscription CLI via `autoswarm run --agent`.
# No API keys anywhere -- codex uses the codex CLI, claude uses the claude CLI.
[routes.luna]
agent = "codex"
model = "gpt-6-luna"
effort = "max"                 # luna tops out at max (no ultra)
# danger-full-access is required or a codex run stalls writing gate files outside
# its workspace; ask-for-approval=never so an autonomous run never blocks waiting
# on a parent approval.
provider_args = ["--sandbox", "danger-full-access", "--ask-for-approval", "never"]
# Discovered: the cwd of the latest autoswarm codex session (~/.codex/sessions).
# Leave blank to auto-resolve; set a path only to pin a specific --cwd.
workspace = ""

[routes.opus]
agent = "claude-code"
model = "claude-opus-4-6[1m]"
provider_args = ["--dangerously-skip-permissions"]
workspace = ""                 # auto: parent of gate_root; MUST contain a .command-gate (deferred passthrough)

[triggers]
timer_floor_minutes = 15

[safety]
dry_run = true
planner_in_dry_run = false     # true = exercise the real LLM planner in dry-run (previews the brain; still dispatches nothing)
stop_file = "STOP"
require_approval = ["modify", "rebaseline", "reset", "rewrite"]
