[paths]
# Machine paths are resolved by discover.py from authoritative sources
# (~/.claude/settings.json, $AUTOSWARM_HOME, PATH). Leave blank to auto-discover;
# pin in config.local.toml (gitignored) to override. Explicit values here win.
autoswarm_home = ""   # else $AUTOSWARM_HOME, else %LOCALAPPDATA%\autoswarm
findings_dir   = ""   # defaults to the codex route's resolved workspace
gate_root      = ""   # parsed from the settings.json PreToolUse hook
backlog_file = "backlog.toml"
ledger_db = "coordinator.db"

[systems]
# Programs `discover.py --check` verifies. Blank = resolved at runtime from
# authoritative sources, never hardcoded (so this file stays safe to publish):
#   codex_handoff_dir  <- ~/.codex/hooks.json (PreCompact/SessionStart)
#   devtools_dir       <- $CODEX_HANDOFF_DEVTOOLS or ~/.codex-handoff/config.json
#   codeapi_ports      <- ~/.codex-handoff/config.json (codeapi.ports)
# Requiredness is PER ROUTE: a `codex` route needs codex_cli + codex_handoff +
# devtools_dir; a `claude-code` route needs claude_cli; the gate is always
# required; CODEAPI / hdb / Akashic are accommodations (reported, never block).
# See docs/ARCHITECTURE.md. Set a value only to override discovery.
codex_handoff_dir    = ""   # codex-handoff checkout's bin/handoff.mjs (or its dir)
devtools_dir         = ""   # Codex_claude_devtools checkout (has scripts/codex-export.ts)
codeapi_ports        = ""   # CODEAPI band, e.g. "47337-47400", or "off"
evidence_catalog_dir = ""   # hdb / HeliosEvidenceCatalog root (child-session data source)
akashic_dir          = ""   # Akashic checkout (installs/validates the Helios runtime)

[caps]
max_concurrent = 3
max_dispatches_per_cycle = 5
max_cycles_per_hour = 6
daily_ceiling = 50

[cooldowns]
default_minutes = 30
failed_retry_minutes = 60
# An in-progress dispatch with no result after this long becomes `stale`
# (flagged for reconciliation, NOT auto-redispatched).
stale_threshold_minutes = 120

[models]
# The planner's own reasoning model. Runs through the `claude` CLI
# (subscription auth) -- never the billed API. Must be a claude-* model;
# a gpt/codex planner would have to route through `autoswarm run --agent codex`.
planner = "claude-opus-4-6[1m]"

# Execution routing for the authority runtime's specialists: which provider,
# model and reasoning effort a specialist session runs on. Routing is
# execution state, resolved after staffing; it is no part of any task
# contract, project, specialist, membership or seat (docs/architecture/
# orchestration/ARCHITECTURE.md, section 6.8). Check it with
# `python -m intelligence.cli preflight` (add --probe to exercise each route).
#
#   default     every specialist session: a retained member's, an outside
#               specialist's, an independent reviewer's (its own session)
#   escalation  work the organization escalates (`escalate`), and single
#               assignments the Project Manager asks to escalate
#   fallback    specialist sessions only while the default route is switched
#               off (`enabled = false` on it), in this order
#   utility     lightweight utility work; never an engineering seat
#
# The Engineer and Project Manager reason on [models] planner above.
[routing]
default = "luna-6-max"
escalation = "opus-4-6-1m"
fallback = ["sonnet"]
utility = "haiku"
# Capabilities (or "capability:role") whose work always runs escalated.
escalate = []

# GPT-6-Luna at its top reasoning effort. Luna has no `ultra`.
# The session runs in a sandbox that can write its own worktree and the
# command-gate pending directory (the Helios handshake) and nothing else,
# and it asks before leaving the sandbox; the supervision policy answers.
#
# A session of this provider inherits the operator's own provider
# configuration: apps and their connectors, plugins, MCP servers, web
# search, browser and desktop control. None of that passes the sandbox or
# the command gate, and none of it is part of an assignment (F-TF-32). The
# overrides below switch it off for the session only; the operator's
# configuration file is not touched. Measured 2026-11-19: 158 tools in a
# session's registry without them, 5 with them (the shell, apply_patch,
# the clock, view_image, write_stdin).
#   - An MCP server is switched off by name: `mcp_servers={}` clears
#     nothing. Add one line per server the provider configuration declares.
#   - `features.multi_agent=false` does not remove this provider's
#     sub-agent tools (F-TF-31); the execution contract forbids them.
[routing.routes.luna-6-max]
agent = "codex"
model = "gpt-6-luna"
effort = "max"
provider_args = [
    "--sandbox", "workspace-write",
    "--ask-for-approval", "on-request",
    "-c", "sandbox_workspace_write.writable_roots=['{gate_pending}', '{gate_pending_real}']",
    "-c", "features.apps=false",
    "-c", "features.plugins=false",
    "-c", "features.computer_use=false",
    "-c", "features.browser_use=false",
    "-c", "features.browser_use_external=false",
    "-c", "features.in_app_browser=false",
    "-c", "features.image_generation=false",
    "-c", "features.goals=false",
    "-c", "features.multi_agent=false",
    "-c", "web_search=\"disabled\"",
    "-c", "mcp_servers.node_repl.enabled=false",
]

[routing.routes.opus-4-6-1m]
agent = "claude-code"
model = "claude-opus-4-6[1m]"

[routing.routes.sonnet]
agent = "claude-code"
model = "sonnet"

[routing.routes.haiku]
agent = "claude-code"
model = "haiku"

# Dispatch routes: each maps to a subscription CLI via `autoswarm run --agent`.
# No API keys anywhere -- codex uses the codex CLI, claude uses the claude CLI.
[routes.luna]
agent = "codex"
model = "gpt-6-luna"
effort = "max"                 # luna tops out at max (no ultra)
# danger-full-access is required or a codex run stalls writing gate files outside
# its workspace; ask-for-approval=never so an autonomous run never blocks waiting
# on a parent approval.
provider_args = ["--sandbox", "danger-full-access", "--ask-for-approval", "never"]
# Discovered: the cwd of the latest autoswarm codex session (~/.codex/sessions).
# Leave blank to auto-resolve; set a path only to pin a specific --cwd.
workspace = ""

[routes.opus]
agent = "claude-code"
model = "claude-opus-4-6[1m]"
provider_args = ["--dangerously-skip-permissions"]
workspace = ""                 # auto: parent of gate_root, whose own hook runs the gate
# Claude Code Remote Control: follow (and message) the child from claude.ai/code
# or the Claude app. true names it "autobot <task id>"; a string replaces
# "autobot". Needs an AutoSwarm with `run --remote-control` and a claude.ai login
# (no ANTHROPIC_API_KEY). Off unless set; codex routes can't use it.
remote_control = false

[triggers]
timer_floor_minutes = 15

[safety]
dry_run = true
planner_in_dry_run = false     # true = exercise the real LLM planner in dry-run (previews the brain; still dispatches nothing)
stop_file = "STOP"
require_approval = ["modify", "rebaseline", "reset", "rewrite"]
